<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Textarea — Aula+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #FBF8F5; color: #241E1B; padding: 24px; }
  .field { max-width: 320px; }
  .label { font-size: 12px; color: #7A6F68; margin-bottom: 4px; }
  textarea { min-height: 64px; width: 100%; border-radius: 6px; border: 1px solid #E7DFD8; padding: 8px 12px; font-size: 14px; box-sizing: border-box; font-family: inherit; resize: vertical; }
  textarea::placeholder { color: #7A6F68; }
  textarea:focus { outline: none; border-color: #A85A35; box-shadow: 0 0 0 3px rgba(168,90,53,0.35); }
</style>
</head>
<body>
  <div class="field">
    <div class="label">Notas de seguimiento</div>
    <textarea placeholder="Escribí una observación...">Buena participación en clase esta semana.</textarea>
  </div>
</body>
</html>
