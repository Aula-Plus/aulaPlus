<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Table — Aula+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #FBF8F5; color: #241E1B; padding: 24px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead tr { border-bottom: 1px solid #E7DFD8; }
  th { text-align: left; padding: 10px 16px; font-weight: 500; color: #7A6F68; }
  tbody tr { border-bottom: 1px solid #E7DFD8; }
  tbody tr:last-child { border-bottom: 0; }
  tbody tr:hover { background: #F3EDE7; }
  td { padding: 16px; vertical-align: middle; }
  a.edit { color: #A85A35; text-decoration: underline; text-underline-offset: 4px; font-weight: 600; }
</style>
</head>
<body>
  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Nivel</th>
        <th>Año</th>
        <th>Docentes</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>3° A</td>
        <td>Primaria</td>
        <td>2026</td>
        <td>Ana Ruiz, Zoe Diaz</td>
        <td style="text-align:right"><a class="edit" href="#">Editar</a></td>
      </tr>
      <tr>
        <td>4° B</td>
        <td>Primaria</td>
        <td>2026</td>
        <td>—</td>
        <td style="text-align:right"><a class="edit" href="#">Editar</a></td>
      </tr>
    </tbody>
  </table>
</body>
</html>
