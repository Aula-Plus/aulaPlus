<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Input — Aula+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #FBF8F5; color: #241E1B; padding: 24px; }
  .row { display: flex; flex-direction: column; gap: 16px; max-width: 320px; }
  .label { font-size: 12px; color: #7A6F68; margin-bottom: 4px; }
  input { height: 36px; width: 100%; border-radius: 6px; border: 1px solid #E7DFD8; padding: 0 12px; font-size: 14px; box-sizing: border-box; background: #FFFFFF; font-family: inherit; }
  input::placeholder { color: #7A6F68; }
  input:focus { outline: none; border-color: #A85A35; box-shadow: 0 0 0 3px rgba(168,90,53,0.35); }
  input.invalid { border-color: #C23A3A; }
  input.disabled { opacity: 0.5; }
</style>
</head>
<body>
  <div class="row">
    <div>
      <div class="label">Por defecto</div>
      <input placeholder="Nombre de la clase" />
    </div>
    <div>
      <div class="label">Con valor</div>
      <input value="3° A" readonly />
    </div>
    <div>
      <div class="label">Inválido</div>
      <input class="invalid" value="" placeholder="Campo requerido" />
    </div>
    <div>
      <div class="label">Deshabilitado</div>
      <input class="disabled" value="No editable" readonly />
    </div>
  </div>
</body>
</html>
