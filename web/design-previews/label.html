<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Label — Aula+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #FBF8F5; color: #241E1B; padding: 24px; }
  .field { max-width: 280px; margin-bottom: 16px; }
  label { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .required { color: #C23A3A; }
  input { height: 36px; width: 100%; border-radius: 6px; border: 1px solid #E7DFD8; padding: 0 12px; font-size: 14px; box-sizing: border-box; font-family: inherit; }
  .disabled label { opacity: 0.5; }
  .disabled input { opacity: 0.5; }
</style>
</head>
<body>
  <div class="field">
    <label>Nombre <span class="required">*</span></label>
    <input placeholder="Nombre de la clase" />
  </div>
  <div class="field disabled">
    <label>Año lectivo</label>
    <input value="2026" readonly disabled />
  </div>
</body>
</html>
