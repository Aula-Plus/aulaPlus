<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>ConfirmDialog — Aula+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; height: 100vh; position: relative; background: #FBF8F5; }
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); }
  .dialog { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; max-width: 420px; background: #FFFFFF; border: 1px solid #E7DFD8; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); padding: 24px; box-sizing: border-box; }
  h2 { margin: 0 0 8px; font-size: 18px; font-weight: 700; }
  p { margin: 0 0 20px; font-size: 14px; color: #7A6F68; }
  .footer { display: flex; justify-content: flex-end; gap: 8px; }
  button { border-radius: 6px; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid transparent; }
  .cancel { background: transparent; border-color: #E7DFD8; color: #241E1B; }
  .confirm { background: #C23A3A; color: #FBF8F5; }
</style>
</head>
<body>
  <div class="overlay"></div>
  <div class="dialog">
    <h2>Eliminar clase</h2>
    <p>Esta acción no se puede deshacer.</p>
    <div class="footer">
      <button class="cancel">Cancelar</button>
      <button class="confirm">Eliminar</button>
    </div>
  </div>
</body>
</html>
