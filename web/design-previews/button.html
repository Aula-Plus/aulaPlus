<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Button — Aula+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #FBF8F5; color: #241E1B; padding: 24px; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .label { font-size: 12px; color: #7A6F68; margin-bottom: 8px; }
  button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid transparent; white-space: nowrap; transition: background-color 0.15s; }
  .default { height: 36px; padding: 0 16px; background: #A85A35; color: #FBF8F5; }
  .default:hover { background: #8C4A2A; }
  .destructive { height: 36px; padding: 0 16px; background: #C23A3A; color: #FBF8F5; }
  .outline { height: 36px; padding: 0 16px; background: #FFFFFF; border-color: #E7DFD8; color: #241E1B; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .secondary { height: 36px; padding: 0 16px; background: #F1EAE3; color: #241E1B; }
  .ghost { height: 36px; padding: 0 16px; background: transparent; color: #241E1B; }
  .link { height: 36px; padding: 0; background: transparent; color: #A85A35; text-decoration: underline; text-underline-offset: 4px; }
  .size-xs { height: 24px; padding: 0 8px; font-size: 12px; background: #A85A35; color: #FBF8F5; }
  .size-sm { height: 32px; padding: 0 12px; background: #A85A35; color: #FBF8F5; }
  .size-default { height: 36px; padding: 0 16px; background: #A85A35; color: #FBF8F5; }
  .size-lg { height: 40px; padding: 0 24px; background: #A85A35; color: #FBF8F5; }
  .disabled { opacity: 0.5; pointer-events: none; }
</style>
</head>
<body>
  <div class="label">Variantes</div>
  <div class="row">
    <button class="default">Guardar</button>
    <button class="destructive">Eliminar</button>
    <button class="outline">Cancelar</button>
    <button class="secondary">Secundario</button>
    <button class="ghost">Ghost</button>
    <button class="link">Ver más</button>
  </div>
  <div class="label">Tamaños</div>
  <div class="row">
    <button class="size-xs">Extra chico</button>
    <button class="size-sm">Chico</button>
    <button class="size-default">Por defecto</button>
    <button class="size-lg">Grande</button>
  </div>
  <div class="label">Estado</div>
  <div class="row">
    <button class="default disabled">Deshabilitado</button>
  </div>
</body>
</html>
