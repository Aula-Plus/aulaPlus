<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Select — Aula+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #FBF8F5; color: #241E1B; padding: 24px; }
  .row { display: flex; flex-direction: column; gap: 16px; max-width: 280px; }
  .label { font-size: 12px; color: #7A6F68; margin-bottom: 4px; }
  select { height: 36px; width: 100%; border-radius: 6px; border: 1px solid #E7DFD8; padding: 0 12px; font-size: 14px; box-sizing: border-box; background: #FFFFFF; color: #241E1B; font-family: inherit; }
  select:focus { outline: none; border-color: #A85A35; box-shadow: 0 0 0 3px rgba(168,90,53,0.35); }
  select.disabled { opacity: 0.5; }
</style>
</head>
<body>
  <div class="row">
    <div>
      <div class="label">Por defecto</div>
      <select>
        <option>Primaria</option>
        <option>Secundaria</option>
      </select>
    </div>
    <div>
      <div class="label">Deshabilitado</div>
      <select class="disabled" disabled>
        <option>2026</option>
      </select>
    </div>
  </div>
</body>
</html>
